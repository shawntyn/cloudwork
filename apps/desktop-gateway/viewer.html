<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Work Desktop</title><style>html,body,#screen{width:100%;height:100%;margin:0;overflow:hidden;background:#14171c}#status{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;font:14px system-ui;pointer-events:none}#status[hidden]{display:none}</style></head><body><div id="screen"></div><div id="status"></div><script type="module">
import RFB from './core/rfb.js';
const query=new URLSearchParams(location.search), workspace=query.get('workspace'), clientId=query.get('clientId'), en=query.get('lang')==='en';
const status=document.querySelector('#status'); let rfb,disposed=false,control=false,retry;
function connect(){clearTimeout(retry);const previous=rfb;rfb=undefined;previous?.disconnect();status.hidden=false;status.textContent=en?'Connecting to desktop…':'正在连接电脑…';const params=new URLSearchParams({workspace,clientId,control:control?'1':'0'});const current=new RFB(document.querySelector('#screen'),`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/desktop/socket?${params}`);rfb=current;rfb.scaleViewport=true;rfb.resizeSession=false;rfb.viewOnly=!control;rfb.addEventListener('connect',()=>{if(current!==rfb)return;status.hidden=true;parent.postMessage({type:'desktop-connected'},location.origin)});rfb.addEventListener('disconnect',()=>{if(current!==rfb)return;status.hidden=false;status.textContent=en?'Disconnected. Reconnecting…':'连接已断开，正在重连…';if(!disposed)retry=setTimeout(connect,2000)});}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent)return;if(event.data?.type==='desktop-control'){const next=event.data.control===true;if(next!==control){control=next;connect()}}if(event.data?.type==='desktop-key'&&control){rfb.sendCtrlAltDel()}if(event.data?.type==='desktop-paste'&&control&&typeof event.data.text==='string'){rfb.clipboardPasteFrom(event.data.text.slice(0,16000))}});
window.addEventListener('keydown',event=>{if(event.altKey&&event.key==='Escape'){event.preventDefault();event.stopImmediatePropagation();parent.postMessage({type:'desktop-exit'},location.origin)}},true);
window.addEventListener('beforeunload',()=>{disposed=true;clearTimeout(retry);rfb?.disconnect()});connect();
</script></body></html>
